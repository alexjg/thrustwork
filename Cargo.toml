[package]
name = "thrustwork"
version = "0.1.0"
edition = "2024"

[dependencies]
automerge = "0.7"
autosurgeon = "0.10.0"
clap = { version = "4.5.53", features = ["derive"] }
samod = { version = "0.5", features = ["tokio", "tungstenite"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
