[package]
name = "thrustwork"
version = "0.1.0"
edition = "2024"

[dependencies]
automerge = "0.7"
autosurgeon = "0.10.1"
bs58 = { version = "0.5.1", features = ["check"] }
clap = { version = "4.5.53", features = ["derive"] }
futures = "0.3.31"
glob = "0.3.3"
hex = "0.4"
mime_guess = "2.0.5"
samod = { version = "0.6.0", features = ["tokio", "tungstenite", "axum"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
thiserror = "2.0.17"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
tracing = "0.1.44"
walkdir = "2.5.0"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tempfile = "3.23.0"
tokio-test = "0.4"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[patch.crates-io]
automerge = { git = "https://github.com/automerge/automerge.git", branch = "view-at" }
